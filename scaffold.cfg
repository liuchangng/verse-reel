# scaffold.cfg - service list for start.bat / stop.bat (generated by spec-superflow-enhanced)
# Format: NAME|START_COMMAND|PORT
#   NAME           service directory (client / server / admin / portal / ...)
#   START_COMMAND  command used to launch it; use - to skip starting it
#   PORT           listening port; stop.bat kills the process listening on it; use - for none
# START_COMMAND runs INSIDE the service directory (start.bat uses `start /d <NAME>`),
# so write `npm run dev`, not `cd client && npm run dev`.
# Lines starting with # are ignored. Empty fields must be written as - (cmd.exe merges separators).
# Adding a service needs one new line here only - start.bat/stop.bat loop over this file.

