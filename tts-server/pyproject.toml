[project]
name = "tts-server"
version = "0.1.0"
description = "TTS 服务 - CosyVoice2 本地 + edge-tts 降级"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "edge-tts>=6.1.0",
    "pydantic>=2.0",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
